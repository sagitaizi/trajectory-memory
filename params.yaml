# Simulation + model parameters. Values are provisional starting points, tuned
# in the sim-vs-real match (Sep 10-13) and the G-F bake-off.

seed: 0

sim:
  resolution: [640, 480]        # DVXplorer, [width, height]
  fps: 1000                     # blob render rate before v2e
  duration_s: 20.0
  blob:
    radius_px: 18
    bg_intensity: 30           # 8-bit grey background
    fg_intensity: 170          # blob brightness; matched to fan_brush_slow_02 (scripts/match_sim_real.py)
  # simulate.load_intrinsics() uses camera.calibration's own pinned DVXplorer file;
  # set an absolute path here only to override it.
  calibration: null
  v2e:
    device: cpu
    pos_thres: 0.2
    neg_thres: 0.2
    sigma_thres: 0.03
    cutoff_hz: 30              # must sit well below fps or v2e's IIR filter is under-sampled
    leak_rate_hz: 0.0
    shot_noise_rate_hz: 0.33   # per-pixel; matched to the real clip's far-from-target rate
    refractory_period_s: 0.0
  # per-clip domain randomisation ranges (make_sim_dataset)
  randomise:
    pos_thres: [0.15, 0.30]
    sigma_thres: [0.01, 0.06]
    shot_noise_rate_hz: [0.0, 1.0]
    fg_intensity: [120, 220]
    affine_jitter: 0.03          # fraction of frame

frontend:
  frame_window_us: 5000
  raw_bin_us: 1000

model:
  horizon_s: 0.1                 # short-horizon prediction target
  reservoir:
    n: 500
    spectral_radius: 1.0
    input_scaling: 0.5
    leak_rate: 0.3
    ridge_beta: 1.0e-4
    washout: 200
  lmu:
    d: 8
    theta_s: 2.0                 # memory window; set to ~one period at fit time
