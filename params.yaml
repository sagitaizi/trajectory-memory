# Simulation + model parameters. Values are provisional starting points, tuned
# in the sim-vs-real match (Sep 10-13) and the G-F bake-off.

seed: 0

sim:
  resolution: [640, 480]        # DVXplorer, [width, height]
  fps: 650                      # blob render rate before v2e
  duration_s: 20.0
  blob:
    radius_px: 18              # minor semi-axis
    aspect: 1.0                # major / minor semi-axis; 1 = disc, ~4 = the pendulum brush
    angle: 0.0                 # radians; ignored when on a string (it hangs along it)
    string: null               # or {pivot: [x, y], thickness_px: 2, intensity: 100}
    texture: {depth: 0.4, scale_px: 4, seed: 0}   # pattern inside the body; depth 0 = flat
    bg_intensity: 30           # 8-bit grey background
    fg_intensity: 90           # blob brightness; matched to fan_brush_slow_02 (scripts/match_sim_real.py)
  # simulate.load_intrinsics() uses camera.calibration's own pinned DVXplorer file;
  # set an absolute path here only to override it.
  calibration: null
  v2e:
    device: cpu
    pos_thres: 0.2
    neg_thres: 0.2
    sigma_thres: 0.03
    cutoff_hz: 0               # photoreceptor filter off: v2e slows it in the dark (tau x 275/(I+20)), leaving a trail the real camera does not show
    leak_rate_hz: 0.0
    shot_noise_rate_hz: 0.1    # per-pixel; matched to the real clip's median 32-px-tile rate far from the target
    refractory_period_s: 0.0
  # per-clip domain randomisation ranges (scripts/make_sim_dataset.py), centred on the
  # matched values above; path sizes are normalised to the frame, periods in seconds
  randomise:
    pos_thres: [0.15, 0.30]
    sigma_thres: [0.01, 0.06]
    shot_noise_rate_hz: [0.03, 0.5]                          # median tile floor: fan 0.09, pendulum 0.28
    fg_intensity: [80, 200]
    radius_px: [8, 30]                                       # fan footprint 18 px, pendulum 32
    aspect: [1.0, 4.0]
    string_fraction: 0.5                                     # fan and pendulum targets hang
    string_intensity: [60, 150]
    string_thickness_px: [1, 3]
    texture_depth: [0.0, 0.8]                                # flat disc to bristly brush
    texture_scale_px: [2.0, 8.0]
    lag_fraction: 0.5                                        # clips with a photoreceptor lag
    cutoff_hz: [60, 200]                                     # a few ms; 0 = instant otherwise
    path:
      shapes: [circle, ellipse, sweep, figure8, lissajous]   # sweep = a straight line
      period_s: [0.8, 4.0]                                   # real clips: 1.0-4.0 s
      semi_axis: [0.05, 0.35]                                # real: fan 0.06, pendulum 0.34
      margin: 0.03                                           # the path never comes closer
      deviation_fraction: 0.5
      wobble:                                                # small smooth imperfections
        perfect_fraction: 0.3                                # this many clips stay exact
        amp_depth: [0.0, 0.08]                               # small_01 beats by ~4 %
        amp_period_s: [3.0, 12.0]
        drift: [0.0, 0.02]                                   # centre wander, ~13 px max
        drift_period_s: [4.0, 15.0]
        phase_depth: [0.0, 0.15]                             # period jitter
        phase_period_s: [3.0, 10.0]
        growth: [-0.02, 0.03]                                # loop_01 grew ~3 %/s

frontend:
  frame_window_us: 5000
  raw_bin_us: 1000

model:
  horizon_s: 0.1                 # short-horizon prediction target
  reservoir:
    n: 500
    spectral_radius: 1.0
    input_scaling: 0.5
    leak_rate: 0.3
    ridge_beta: 1.0e-4
    washout: 200
  lmu:
    d: 8
    theta_s: 2.0                 # memory window; set to ~one period at fit time
